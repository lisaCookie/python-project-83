[project]
name = "hexlet-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.1",
    "gunicorn>=23.0.0",
    "pytest-cov>=6.1.1",
    "python-dotenv>=1.1.1",
    "psycopg2-binary>=2.9.3",
    "validators>=0.35.0",
    "requests",
    "beautifulsoup4",	
]

[dependency-groups]
dev = [
    "ruff>=0.12.7",
]


[tool.uv.workspace]
members = ["scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_analyzer"]



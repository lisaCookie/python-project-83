<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>URL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css" />
</head>
<body class="container py-4">
    <h1>Введённый URL</h1>
    <table class="table table-bordered" data-test="url">
        <tr>
            <th>URL</th>
            <td>{{ url }}</td>
        </tr>
        <tr>
            <th>Дата добавления</th>
            <td>{{ created_at }}</td>
        </tr>
    </table>
    <h2>Проверки</h2>
    {% if checks %}
        <ul>
        {% for check in checks %}
            <li>ID: {{ check[0] }}, дата: {{ check[1] }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Проверок пока нет</p>
    {% endif %}


    <form action="{{ url_for('url_checks', id=url_id) }}" method="post">
        <button type="submit" class="btn btn-primary mb-3">Запустить проверку</button>
    </form>

    <a href="{{ url_for('home') }}" class="btn btn-primary">На главную</a>
    <a href="{{ url_for('urls') }}" class="btn btn-secondary" data-test="urls">Все URL</a>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

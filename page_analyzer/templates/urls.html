<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Все URL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css" />
</head>
<body class="container py-4">
    <h1>Все добавленные URL</h1>
    <table class="table table-striped" data-test="urls">
        <thead>
            <tr>
                <th>ID</th>
                <th>URL</th>
                <th>Дата добавления</th>
            </tr>
        </thead>
        <tbody>
            {% for id, name, created_at in urls %}
            <tr>
                <td>{{ id }}</td>
                <td><a href="{{ url_for('url_detail', id=id) }}">{{ name }}</a></td>
                <td>{{ created_at }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{{ url_for('home') }}" class="btn btn-primary">На главную</a>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
